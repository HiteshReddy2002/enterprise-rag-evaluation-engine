[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rag-engine"
version = "0.1.0"
description = "Production-Ready LLM RAG System with Automated Evaluation Pipeline and FastAPI Service"
readme = "README.md"
authors = [{ name = "AI/ML Engineer" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "numpy>=1.26.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "scikit-learn>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
